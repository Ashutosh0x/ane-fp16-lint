[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ane-fp16-lint"
version = "0.1.0"
description = "Detect silent fp16 overflow/underflow in Core ML models before they corrupt inference on Apple Neural Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Ashutosh Kumar Singh", email = "ashutosh0x@proton.me"}
]
keywords = ["coreml", "fp16", "neural-engine", "apple", "lint", "numerical-stability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "coremltools>=7.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
ane-fp16-lint = "ane_fp16_lint.cli:main"

[project.urls]
Homepage = "https://github.com/Ashutosh0x/ane-fp16-lint"
Repository = "https://github.com/Ashutosh0x/ane-fp16-lint"
Issues = "https://github.com/Ashutosh0x/ane-fp16-lint/issues"
